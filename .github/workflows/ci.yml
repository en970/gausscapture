name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      # OpenCV's non-headless wheel links against system GL/glib, which the
      # Ubuntu runner image does not ship.
      - name: Install OpenCV system libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgl1 libglib2.0-0

      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      # The smoke test is deliberately CPU-only and free of fixture binaries:
      # it synthesises its own video, so it runs on a standard runner in
      # seconds and gates every push.
      - name: Test
        run: pytest --cov=gausscapture --cov-report=term-missing

      - name: CLI is installed and runnable
        run: |
          gausscapture --version
          gausscapture doctor --json

  licence-gate:
    name: licence gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # GaussCapture ships under MIT and its users must be able to use their
      # output commercially. The reference 3DGS implementation is licensed for
      # non-commercial research only, and several apparently permissive
      # repositories vendor its rasterizer -- so the presence of these names
      # anywhere in the resolved tree is a build failure, not a warning.
      # See docs/DEPENDENCIES.md.
      - name: Reject non-commercial Gaussian splatting components
        run: |
          set -e
          FORBIDDEN='diff_gaussian_rasterization|diff-gaussian-rasterization|simple-knn|simple_knn|LICENSE_gaussian_splatting'
          if grep -rIEl "$FORBIDDEN" \
               --exclude-dir=.git \
               --exclude-dir=node_modules \
               --exclude-dir=docs \
               --exclude-dir=site \
               --exclude-dir=.github \
               . ; then
            echo "::error::A non-commercially licensed Gaussian splatting component was found."
            echo "The rasterizer must be gsplat (Apache-2.0). See docs/DEPENDENCIES.md."
            exit 1
          fi
          echo "No non-commercial rasterizer references found."

      - name: Install and check declared dependency licences
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pip-licenses
          pip-licenses --format=markdown --with-urls \
            --packages numpy opencv-python gausscapture
          # Any copyleft or non-commercial licence among *bundled* dependencies
          # is a defect. Copyleft tools we merely invoke (ffmpeg, COLMAP) never
          # appear here because they are not Python dependencies.
          if pip-licenses --format=csv --packages numpy opencv-python \
             | grep -Ei 'GPL|AGPL|CC-BY-NC|non-commercial'; then
            echo "::error::A copyleft or non-commercial licence appeared in the bundled set."
            exit 1
          fi
