[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gausscapture"
version = "0.2.0"
description = "Local-first phone capture for 3D Gaussian splatting, with capture-time quality telemetry"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Enes Öz", email = "enesozile@gmail.com" }]
keywords = [
    "gaussian-splatting",
    "3d-reconstruction",
    "novel-view-synthesis",
    "photogrammetry",
    "capture-quality",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Graphics :: 3D Modeling",
    "Topic :: Scientific/Engineering :: Image Processing",
]

# The core deliberately depends only on OpenCV and NumPy. The web layer is an
# optional extra so that `pip install gausscapture` gives you a usable library
# and CLI without pulling in a web framework -- which is also what lets the
# package be reviewed as a library rather than a web application.
dependencies = [
    "numpy>=1.26",
    "opencv-python>=4.9",
]

[project.optional-dependencies]
server = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.7",
    "python-multipart>=0.0.9",
    "Pillow>=10.3",
]
mesh = ["open3d>=0.18"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    # The reference BagIt implementation. Used only to verify that our packs
    # are readable by tooling that knows nothing about GaussCapture -- which is
    # the whole claim of the profile, so it deserves a test rather than a
    # paragraph.
    "bagit>=1.8",
]

[project.scripts]
gausscapture = "gausscapture.cli:main"

[project.urls]
Homepage = "https://en970.github.io/gausscapture/"
Repository = "https://github.com/en970/gausscapture"
Issues = "https://github.com/en970/gausscapture/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/gausscapture"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]
# Colab notebooks are written for a hosted runtime with implicit globals and
# shell escapes; linting them fights the format rather than improving it.
extend-exclude = ["notebooks", "frontend", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = [
    "E501",   # line length is handled by the formatter
    "B008",   # FastAPI's Depends() pattern needs calls in defaults
]

[tool.ruff.lint.isort]
known-first-party = ["gausscapture"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["error::DeprecationWarning:gausscapture.*"]
